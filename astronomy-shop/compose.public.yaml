# Public gate in front of the shop, for the Cloudflare link.
# Started by ./shop.sh public. Listens on localhost:8088.
services:
  public-gate:
    image: nginx:1.29-alpine
    container_name: public-gate
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./public-gate/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - opentelemetry-demo
    restart: unless-stopped

networks:
  opentelemetry-demo:
    external: true
