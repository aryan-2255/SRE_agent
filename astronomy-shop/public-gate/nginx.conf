# Public gate: what visitors on the Cloudflare link can reach.
# Only the shop is public. Admin tools stay on http://localhost:8080 for you.
server {
  listen 80;

  # Admin and monitoring pages: never public.
  location ~ ^/(feature|grafana|jaeger|loadgen|telemetry|opamp|profiles)(/|$) {
    return 403 "Not available on the public link.\n";
  }

  # Everything else (store pages, /api, /images, /otlp-http, /flagservice, /chatbot) goes to the shop.
  location / {
    proxy_pass http://frontend-proxy:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
