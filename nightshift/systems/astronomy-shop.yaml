# Onboarding file: everything NightShift needs to know about one system.
# To watch another system, write another file like this. No agent code changes.
name: astronomy-shop
domain: e-commerce
repo:
  url: https://github.com/aryan-2255/opentelemetry-demo   # the shop's own repo: agents read commits and open PRs here
  branch: main
  local_path: ../astronomy-shop
runtime:
  type: docker-compose
  project: astronomy-shop
  env_files: [.env, .env.override]
  compose_files: [compose.yaml, compose.full.yaml, compose.observability.yaml, compose.extras.yaml, compose.agent.yaml]
# URLs as seen from inside the opentelemetry-demo network (ops-mcp). control uses localhost:9090 for Prometheus.
telemetry:
  metrics: { type: prometheus, url: http://prometheus:9090, error_metric: traces_span_metrics_calls_total, duration_metric: traces_span_metrics_duration_milliseconds_bucket }
  logs:    { type: opensearch, url: http://opensearch:9200, index: "otel-logs-*", service_field: resource.service.name.keyword }
  traces:  { type: jaeger, url: http://frontend-proxy:8080/jaeger/ui/api/v3, ui: http://localhost:8080/jaeger/ui }
flags: { type: flagd, file: src/flagd/demo.flagd.json }
shop_url: http://frontend-proxy:8080
services:
  # depends_on: who this service calls. When a service and one of its dependencies fail together, the incident opens
  # on the dependency (the likelier root cause). Services without an slo are operated (restart, rollback) but not watched.
  payment:         { language: javascript, path: src/payment,         test_cmd: "npm ci && node --test", slo: { max_error_pct: 5, p95_ms: 800 } }
  frontend:        { language: typescript, path: src/frontend,        test_cmd: "npm ci && npm test",   slo: { max_error_pct: 5, p95_ms: 1500 }, depends_on: [cart, checkout, product-catalog, recommendation, ad, currency, shipping] }
  checkout:        { language: go,         path: src/checkout,        slo: { max_error_pct: 5 }, depends_on: [payment, cart, product-catalog, shipping, email, currency, kafka] }
  cart:            { language: csharp,     path: src/cart,            slo: { max_error_pct: 5 }, depends_on: [valkey-cart] }
  product-catalog: { language: go,         path: src/product-catalog, slo: { max_error_pct: 5 } }
  recommendation:  { language: python,     path: src/recommendation,  test_cmd: "pip install -r requirements.txt && pytest", slo: { max_error_pct: 5 }, depends_on: [product-catalog] }
  shipping:        { language: rust,       path: src/shipping,        slo: { max_error_pct: 5 }, depends_on: [quote] }
  quote:           { language: php,        path: src/quote,           slo: { max_error_pct: 5 } }
  currency:        { language: cpp,        path: src/currency,        slo: { max_error_pct: 5 } }
  email:           { language: ruby,       path: src/email,           slo: { max_error_pct: 5 } }
  ad:              { language: java,       path: src/ad,              slo: { max_error_pct: 5 } }
  accounting:      { language: csharp,     path: src/accounting,      slo: { max_error_pct: 5 }, depends_on: [kafka] }
  fraud-detection: { language: kotlin,     path: src/fraud-detection, slo: { max_error_pct: 5 }, depends_on: [kafka] }
  agent:           { language: python,     path: src/agent,           slo: { max_error_pct: 35, max_op_error_pct: 100 }, depends_on: [product-catalog] }   # baseline ~17% errors (LLM calls)
  # infrastructure: no request metrics of their own, but agents may restart them
  kafka:           { language: infra, path: src/kafka }
  valkey-cart:     { language: infra, path: src/valkey-cart }
  otel-collector:  { language: infra, path: src/otel-collector }
  prometheus:      { language: infra, path: src/prometheus }
# Code shared by several services: validator and coder check these out too (protobuf contracts, shared libraries).
shared_paths: [pb, src/shared]
# Signals that error percentages miss. Each PromQL returns one number; above the limit for the hold time opens an incident.
signals:
  - name: fraud-detection queue lag
    service: fraud-detection
    promql: max(kafka_consumer_records_lag_max{service_name="fraud-detection"})
    above: 100
    explain: orders waiting unread in Kafka for fraud-detection
  - name: accounting stopped consuming orders
    service: accounting
    promql: (sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_name="publish orders"}[2m])) > 0.005) * 0 + on() ((sum(rate(traces_span_metrics_calls_total{service_name="accounting",span_kind="SPAN_KIND_CONSUMER"}[2m])) or on() vector(0)) == bool 0)
    above: 0.5
    explain: checkout is publishing orders but accounting has processed none in 2 minutes
# window: metrics window; for / demo_for: how long a problem must last. A problem needs min_failures failed requests in
# the window (or min_rps of traffic) to count; with less traffic the timer pauses instead of resetting.
# op_error_pct: the limit for any single operation (endpoint), so one broken endpoint cannot hide in a service's average.
watch: { window: 2m, for: 2m, demo_for: 30s, min_rps: 0.05, min_failures: 3, op_error_pct: 20, poll_seconds: 5, blind_after_s: 60 }
autonomy:
  auto: [notify]               # internal team updates need no approval. Night mode adds: rollback, restart_service
  ask: [rollback, restart_service, scale_service, set_flag, deploy, deploy_canary, promote_canary, create_pull_request, merge_pull_request]
  never: [drop_table, delete_data, read_secret]
  quiet_hours: "22:00-09:00"
tickets: { type: jira, project: SRE }
notify: { type: slack }
