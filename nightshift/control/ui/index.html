<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NightShift: an on-call team of AI agents that diagnoses incidents and asks a human before every change." />
    <title>NightShift · Operations</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q || localStorage.getItem("ns-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
