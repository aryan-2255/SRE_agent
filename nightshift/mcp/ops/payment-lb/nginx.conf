# gRPC load balancer in front of payment. Weights live in upstream.conf,
# which the ops MCP rewrites to shift canary traffic (e.g. 90/10).
events {}
http {
  include /etc/nginx/upstream/upstream.conf;
  server {
    listen 50051;
    http2 on;
    location / {
      grpc_pass grpc://payment_backends;
      grpc_read_timeout 30s;
    }
  }
}
